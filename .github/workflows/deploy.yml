name: Develop deployment

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: true
      - run: ./gradlew --no-daemon clean build
      # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jar-${{ github.sha }}
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: danditon-image-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # https://github.com/actions/download-artifact/releases/tag/v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jar-${{ github.sha }}
          path: build/libs
      - id: publish
        env:
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ops/ci/publish.sh
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/danditon-publish"
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment: production
    concurrency:
      group: danditon-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Transfer and deploy verified release
        env:
          SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: bash ops/ci/deploy.sh
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/danditon-deploy"
