name: Pull Request CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        # https://github.com/actions/setup-java/releases/tag/v6.1.0
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate wrapper and set up Gradle
        # https://github.com/gradle/actions/releases/tag/v6.4.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          validate-wrappers: true
          cache-provider: basic
          cache-read-only: true

      - name: Build and test
        run: ./gradlew --no-daemon clean build
