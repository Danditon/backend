spring:
  application:
    name: ${SPRING_APPLICATION_NAME:danditon}
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}

springdoc:
  paths-to-match: /api/**
  override-with-generic-response: false
  swagger-ui:
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
